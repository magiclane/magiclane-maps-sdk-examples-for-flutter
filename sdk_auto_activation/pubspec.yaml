name: sdk_auto_activation
description: A Flutter example using Maps SDK for Flutter.

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter

  magiclane_maps_flutter: ^3.1.9
  
  shared_preferences: ^2.5.3
  cupertino_icons: ^1.0.8
  qr_flutter: ^4.1.0
  uuid: ^4.5.1 
  internet_connection_checker: 3.0.1
  dio: ^5.8.0+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  
flutter:
  uses-material-design: true